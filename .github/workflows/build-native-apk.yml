name: Build Likkho Native APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK (Kotlin + Jetpack Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip and Fix Project Structure (extract into repo paths + commit)
        run: |
          echo "=== 1. Checking files in root after checkout ==="
          ls -la

          # Files already in their paths? Then nothing to do.
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "✅ Project files already in their paths. Skipping extraction."
          else
            ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "❌ ERROR: No project files and no .zip found in root!"
              exit 1
            fi

            echo "📦 Found ZIP file: $ZIP_FILE. Extracting..."
            rm -rf temp_extracted && mkdir -p temp_extracted
            unzip -q "$ZIP_FILE" -d temp_extracted

            SETTINGS_PATH=$(find temp_extracted -name "settings.gradle.kts" -type f | head -n 1)
            if [ -z "$SETTINGS_PATH" ]; then
              echo "❌ ERROR: settings.gradle.kts not found inside the zip."
              exit 1
            fi
            PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
            echo "✅ Project root found at $PROJECT_ROOT"

            # copy to real paths, never overwrite your .github folder
            rsync -a --exclude='.github' "$PROJECT_ROOT"/ ./
            rm -rf temp_extracted

            # remove the zip from the repo
            git rm -q --cached "$ZIP_FILE" 2>/dev/null || true
            rm -f "$ZIP_FILE"

            # commit + push unpacked files (normal branch pushes only)
            if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref_type }}" = "branch" ]; then
              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "Unpack project zip into repo paths" || echo "nothing to commit"
              git push origin "HEAD:${{ github.ref_name }}"
            else
              echo "ℹ️ Not a branch push - files extracted for this build only."
            fi
          fi

          echo "=== 3. Final Root Contents Before Build ==="
          ls -la
          
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download UI fonts
        shell: bash
        run: |
          set -u
          mkdir -p app/src/main/assets/fonts
          cd app/src/main/assets/fonts
          base="https://raw.githubusercontent.com/google/fonts/main/ofl"
          dl() {
            local out="$1" url="$2"
            if [ -s "$out" ]; then echo "already present: $out"; return 0; fi
            if curl -fsSL --retry 3 --retry-delay 2 -o "$out" "$url"; then
              echo "downloaded: $out"
            else
              rm -f "$out"
              echo "::warning::Could not download $out - app will use a fallback font"
            fi
          }
          dl CormorantGaramond-Variable.ttf "$base/cormorantgaramond/CormorantGaramond%5Bwght%5D.ttf"
          dl PlusJakartaSans-Variable.ttf   "$base/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf"
          dl IBMPlexMono-Regular.ttf        "$base/ibmplexmono/IBMPlexMono-Regular.ttf"
          dl IBMPlexMono-Medium.ttf         "$base/ibmplexmono/IBMPlexMono-Medium.ttf"
          dl Lora-Variable.ttf              "$base/lora/Lora%5Bwght%5D.ttf"
          dl Lora-Italic-Variable.ttf       "$base/lora/Lora-Italic%5Bwght%5D.ttf"
          ls -la

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Likkho-native-ui-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Likkho-native-ui-debug-apk
          path: dist/Likkho-native-ui-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Likkho-native-ui-debug.apk
          
